<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">

    <!-- Fallback für iOS (Safari ignoriert das Manifest teilweise) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="pics/BetMetricsLogo.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetMetrics</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="pics/BetMetricsLogo.ico" type="image/x-icon">

    <script src="https://cdn.jsdelivr.net/npm/mathjs@12.4.2/lib/browser/math.js"></script>
    <script src="logic.js" defer></script>
    <script src="football.js" defer></script>
</head>
<body>
    <canvas style="position: absolute;" id="football" width="500" height="500"></canvas>
    <div style="display: flex; width: 100vw; height: 100%; flex-direction: column; align-items: center;">
        <div style="z-index: 1; background-color: white; width: 80%; max-width: 700px; text-align: center; border-radius: 20px; padding: 0 20px 30px 20px; margin-top: 50px;">
            <h3 class="not-selectable" style="margin-bottom: 30px; font-weight: 500; ">Betting Odds</h3>
            <div class="bookmaker-odds-wrapper">
                <div style="position: relative; width: clamp(50px, 100%, 135px);">
                    <label class="not-selectable" for="betting_odd_1">1</label>
                    <input class="card" type="number" name="betting_odd_1" onchange="change()" id="betting_odd_1" value="1">
                </div>
                <div style="position: relative; width: clamp(50px, 100%, 135px);">
                    <label class="not-selectable" for="betting_odd_X">X</label>
                    <input class="card" type="number" name="betting_odd_X" onchange="change()" id="betting_odd_X" value="1">
                </div>
                <div style="position: relative; width: clamp(50px, 100%, 135px);">
                    <label class="not-selectable" for="betting_odd_2">2</label>
                    <input class="card" type="number" name="betting_odd_2" onchange="change()" id="betting_odd_2" value="1">
                </div>
            </div>
        </div>
        
        <div class="not-selectable" id="bottom-part" style="display: flex; align-items: center; flex-direction: column; color: white; width: 100vw; border-radius: 25px 25px 0 0 ; background-color: var(--red); margin-top: auto; padding: 20px; box-sizing: border-box;">
            <h1 style="text-align: center; color: white;">Results</h1>
            <div style="display: flex; justify-content: space-between; width: 80%; max-width: 600px; gap: 20px;">
                <div class="card cStyle1 not-selectable">
                    <label for="">1</label>
                    <h4 id="1">-</h4>
                </div>
                <div class="card cStyle1 not-selectable">
                    <label for="">X</label>
                    <h4 id="X">-</h4>
                </div>
                <div class="card cStyle1 not-selectable">
                    <label for="">2</label>
                    <h4 id="2">-</h4>
                    
                </div>
            </div>

            <div style="margin-top: 40px; text-align: center;" id="ExpValue">
                On Average you loose 20% of your bet amount on every bet.
            </div>
        </div>
    </div>
    
</body>
</html>
